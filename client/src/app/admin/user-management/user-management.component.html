<div class="row">
    <table class="table">
        <thead>
            <tr>
                <th style="width: 30%;">Username</th>
                <th style="width: 40%;">Active roles</th>
                <th style="width: 30%;"></th>
            </tr>
        </thead>
        <tbody *ngFor="let user of users">
            <tr>
                <td>{{user.username}}</td>
                <td>{{user.roles}}</td>
                <td><button class="btn btn-success" (click)="openRolesModal(user)">Edit Roles</button></td>
            </tr>
        </tbody>
    </table>
</div>
