<div class="card">
    <div class="card-body">
        <div *ngIf="messageService.messageThread().length === 0">
            <p>No message yet</p>
        </div>
            <div *ngIf="messageService.messageThread().length > 0" class="chat" #scrollMe style="overflow: scroll; max-height: 500px; scroll-behavior: smooth;">
                <ul  *ngFor="let message of messageService.messageThread()">
                    <li>
                        <div>
                            <span class="chat-img float-end">
                                <img class="rounded-circle" src="{{message.senderPhotoUrl || './asset/user.png'}}" alt="Image of message sender">
                            </span>
                            <div class="chat-body">
                                <div class="header">
                                    <small class="text-muted">
                                        <span class="fa fa-clock-o">
                                            {{message.messageSent | timeago}}
                                        </span>
                                        <span *ngIf="!message.dateRead && message.senderUsername !== username">
                                            <span class="text-danger">(Unread)</span>
                                        </span>
                                        <span *ngIf="message.dateRead && message.senderUsername !== username">
                                            <span class="text-success">(read {{message.dateRead | timeago}})</span>
                                        </span>
                                    </small>
                                </div>
                                <p>{{message.content}}</p>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
    </div>
    <div class="card-footer">
        <form #messageForm = "ngForm" (ngSubmit)="sendMessages()">
            <div class="input-group">
                <input 
                name="messageContent"
                required
                [(ngModel)] = "messageContent"
                type="text" 
                class="form-control input-sm" 
                placeholder="Send a private message">
                <div class="input-group-append">
                    <button [disabled]="!messageForm.value" class="btn btn-primary" type="submit">Send</button>
                </div>
            </div>
        </form>
    </div>
</div>
