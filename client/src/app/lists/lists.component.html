<div class="text-center mt-3">
    <h2>{{getTitle()}}</h2>
</div>

<div class="container mt-3">
    <div class="d-flex">
        <div class="btn-group">
            <button 
            class="btn btn-primary"
            btnRadio="liked"
            [(ngModel)]="predicate"
            (click)="loadLikes()"
            >
            Members i like
            </button>
            <button 
            class="btn btn-primary"
            btnRadio="likedBy"
            [(ngModel)]="predicate"
            (click)="loadLikes()"
            >
            Members who like me
            </button>
            <button 
            class="btn btn-primary"
            btnRadio="mutual"
            [(ngModel)]="predicate"
            (click)="loadLikes()"
            >
           Mutual
            </button>
        </div>
      
    </div>
    <div class="row mat-3">

        <div *ngFor="let member of likesService.paginatedResult()?.items" class="col-2">
            <app-member-card [member] = "member"></app-member-card>
        </div>
    </div>
</div>

<div *ngIf="likesService.paginatedResult()?.pagination">
    <div class="d-flex justify-content-center">
        <pagination 
        [boundaryLinks]="true" 
        [totalItems]="likesService.paginatedResult()?.pagination!.totalItems"
        [itemsPerPage]="likesService.paginatedResult()?.pagination!.itemsPerPage"
        (pageChanged) = "pageChanged($event)"
        [(ngModel)]="likesService.paginatedResult()?.pagination!.currentPage"
        [maxSize]="10"
        previousText="&lsaquo;" 
        nextText="&rsaquo;" 
        firstText="&laquo;" 
        lastText="&raquo;">
     
    </pagination>
    </div>
    
</div>
